name: Build and Publish to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write # important so deploy can push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          commit-message: "Deploy to GitHub Pages"
